[package]
name = "rclone-shell-ext-cosmic"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "COSMIC panel applet showing rclone mount and upload status"

[dependencies]
jiff.workspace = true
rclone-shell-ext.workspace = true
rclone-ui-core.workspace = true
rclone-ui-i18n.workspace = true
rclone-ui-view.workspace = true
serde.workspace = true
tokio.workspace = true

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
# xdg-portal: the settings window's folder picker (`cosmic::dialog::file_chooser`).
features = ["applet", "dbus-config", "multi-window", "tokio", "wayland", "winit", "xdg-portal"]

[lints]
workspace = true

[dev-dependencies]
rclone-ui-core = { workspace = true, features = ["test-identity"] }
