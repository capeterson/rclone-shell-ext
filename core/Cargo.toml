[package]
name = "rclone-ui-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Toolkit-free rclone status, offline-folder and setup logic shared by the rclone UI front ends"

[lib]
name = "rclone_ui_core"

[dependencies]
base64 = "0.22"
jiff = "0.2"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
xdg-mime = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Byte counts and percentages are converted to f64/f32 purely for display.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# This is a library: its pub fns are the API, so these pedantic doc lints add noise.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
