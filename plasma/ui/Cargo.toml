[package]
name = "rclone-shell-ext-plasma-ui"
description = "Kirigami windows (details, settings) for rclone-shell-ext on Plasma, via cxx-qt"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rclone-ui-core.workspace = true
serde.workspace = true
serde_json.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[dev-dependencies]
rclone-ui-core = { workspace = true, features = ["test-identity"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[lints]
workspace = true
