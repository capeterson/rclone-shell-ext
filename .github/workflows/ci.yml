name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC: runs everything, including the `live` job.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Decides which jobs matter. Only pull requests are filtered; pushes to main, the weekly
  # schedule and manual runs treat everything as changed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.out.outputs.core }}
      cosmic: ${{ steps.out.outputs.cosmic }}
      plasma: ${{ steps.out.outputs.plasma }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared:
              - 'crates/**'
              - 'i18n/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/**'
              - 'justfile'
            cosmic:
              - 'cosmic/**'
              - 'resources/**'
            plasma:
              - 'plasma/**'
              - 'resources/**'
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          COSMIC: ${{ steps.filter.outputs.cosmic }}
          PLASMA: ${{ steps.filter.outputs.plasma }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$SHARED" = true ]; then
            printf '%s\n' core=true cosmic=true plasma=true >> "$GITHUB_OUTPUT"
          else
            # core always runs: it is cheap, and its strings sync test scans cosmic/ and plasma/.
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "cosmic=$COSMIC" >> "$GITHUB_OUTPUT"
            echo "plasma=$PLASMA" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  # The toolkit-free crates. No system packages: nothing here links Qt, Wayland or fontconfig.
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cargo.lock must be committed (it pins libcosmic)
        run: git ls-files --error-unmatch Cargo.lock
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p rclone-ui-core -p rclone-ui-i18n -p rclone-ui-view -p rclone-shell-ext --all-targets --locked -- -D warnings
      # Includes the strings sync test in rclone-ui-i18n.
      - run: cargo test -p rclone-ui-core -p rclone-ui-i18n -p rclone-ui-view -p rclone-shell-ext --locked

  cosmic:
    needs: changes
    if: needs.changes.outputs.cosmic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev wayland-protocols \
            libfontconfig-dev libfreetype-dev libexpat1-dev libudev-dev \
            libinput-dev libegl-dev libgbm-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cosmic
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p rclone-shell-ext-cosmic --all-targets --locked -- -D warnings
      - run: cargo test -p rclone-shell-ext-cosmic --locked

  # Qt6/KF6 live in a Fedora container: the dev packages are current there and cxx-qt needs
  # a real Qt 6 (qmake6) to build against.
  plasma:
    needs: changes
    if: needs.changes.outputs.plasma == 'true'
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 45
    steps:
      # cxx-qt: qt6-qtbase-devel (qmake6, Core/Gui) and qt6-qtdeclarative-devel (Qml, Quick
      # Controls 2; also ships qmllint). Dolphin plugins: ECM, KIO, KCoreAddons, Qt DBus/Widgets
      # from qtbase (their text comes from the daemon, so no KI18n).
      # gcc-c++ and cmake build the C++; git-core is for actions/checkout.
      - name: System packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git-core curl ca-certificates tar gzip which findutils just \
            gcc-c++ cmake extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kio-devel kf6-kcoreaddons-devel
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plasma
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p rclone-shell-ext-plasma -p rclone-shell-ext-plasma-ui --all-targets --locked -- -D warnings
      - run: cargo test -p rclone-shell-ext-plasma -p rclone-shell-ext-plasma-ui --locked
      - name: Dolphin plugins (cmake)
        run: |
          cmake -B target/dolphin -S plasma/dolphin
          cmake --build target/dolphin
      # Syntax and type errors in the QML; imports the container cannot resolve (Kirigami,
      # org.kde.plasma.*, our own cxx-qt module) are not failures. See plasma/justfile.
      - name: qmllint
        run: just plasma::lint-qml

  # Weekly and manual only: our rclone-facing code against the newest rclone release, to catch
  # behaviour changes between rclone versions. The same steps as `just test-live`.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Latest rclone release
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://downloads.rclone.org/version.txt | awk '{print $2}')
          zip="rclone-${version}-linux-amd64.zip"
          base="https://downloads.rclone.org/${version}"
          mkdir -p "$RUNNER_TEMP/rclone"
          cd "$RUNNER_TEMP/rclone"
          curl -fsSLO "$base/$zip"
          curl -fsSLO "$base/SHA256SUMS"
          grep -F "  $zip" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          install -Dm0755 "rclone-${version}-linux-amd64/rclone" "$HOME/.local/bin/rclone"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rclone" version
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just test-live

  # The single required status check for branch protection: require `ci-ok` and nothing else.
  # It passes when every job it needs succeeded or was skipped (path filters skip jobs) and
  # fails when any failed or was cancelled, so new jobs only have to be added to `needs`.
  ci-ok:
    if: always()
    needs: [changes, fmt, core, cosmic, plasma, live]
    runs-on: ubuntu-24.04
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled" >&2
            exit 1
          fi
